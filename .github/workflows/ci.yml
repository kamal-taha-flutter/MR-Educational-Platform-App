name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify demo mode is connected to no real backend
        run: |
          set -e
          if grep -RIn --include='*.dart' --include='*.yaml' --include='*.yml' \
              -e 'ertiqaa' -e 'mr-edu\.' -e 'firebaseio\.com' -e 'AIza[0-9A-Za-z_-]\{35\}' \
              lib test integration_test 2>/dev/null; then
            echo 'ERROR: real-backend references found in source.' >&2
            exit 1
          fi
          echo 'OK: no real-backend references in source.'

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-android-debug:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-demo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
